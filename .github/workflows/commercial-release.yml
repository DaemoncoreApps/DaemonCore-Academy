name: Commercial Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v6.0.0
        required: true
        type: string
      allow_unsigned:
        description: Publish without Authenticode signing and show an unsigned-build warning
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    environment: commercial-release

    env:
      CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prepare Windows signing
        id: signing
        shell: pwsh
        run: |
          if (
            -not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64) -and
            -not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)
          ) {
            [IO.File]::WriteAllBytes(
              "$env:RUNNER_TEMP\daemoncore-signing.pfx",
              [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
            )

            "enabled=true" >> $env:GITHUB_OUTPUT
            Write-Host "Windows signing certificate detected."
          }
          else {
            if ("${{ inputs.allow_unsigned }}" -ne "true") {
              throw "No Windows signing certificate is configured. Set allow_unsigned only for an explicitly approved unsigned release."
            }

            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Warning "No Windows signing certificate configured. Building an explicitly approved unsigned installer."
          }

      - name: Build signed Windows installer
        if: steps.signing.outputs.enabled == 'true'
        env:
          CSC_LINK: ${{ runner.temp }}\daemoncore-signing.pfx
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run package:win

      - name: Build unsigned Windows installer
        if: steps.signing.outputs.enabled != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:win

      - name: Verify installer and checksum
        id: installer
        shell: pwsh
        run: |
          $installer = Get-Item "release\DaemonCore-Academy-Setup.exe"

          if (-not $installer) {
            throw "Installer not found"
          }

          if ("${{ steps.signing.outputs.enabled }}" -eq "true") {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName

            if ($signature.Status -ne "Valid") {
              throw "Authenticode status is $($signature.Status)"
            }

            Write-Host "Authenticode signature verified."
          }
          else {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName

            if ($signature.Status -ne "NotSigned") {
              throw "Expected an unsigned installer, but Authenticode status is $($signature.Status)"
            }

            Write-Warning "Installer is not Authenticode-signed. Customers may see Unknown Publisher."
          }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash
          $checksum = Join-Path $installer.DirectoryName "SHA256SUMS-windows.txt"
          "$($hash.ToLowerInvariant())  $($installer.Name)" | Set-Content -LiteralPath $checksum -Encoding utf8NoBOM

          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows installer to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload "${{ inputs.tag }}" "${{ steps.installer.outputs.installer }}" "${{ steps.installer.outputs.checksum }}" --clobber

      - name: Remove certificate material
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "$env:RUNNER_TEMP\daemoncore-signing.pfx" -Force -ErrorAction SilentlyContinue
