name: daemoncore-night-shift

services:
  operator:
    build:
      context: ./operator
    container_name: dc-night-operator
    command: ["sleep", "infinity"]
    networks: [range]
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /workspace:size=32m,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.75
    restart: "no"

  evidence-target:
    build:
      context: ./target
    container_name: dc-night-target
    networks:
      range:
        aliases: [evidence-target]
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 96m
    cpus: 0.25
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 2s
      timeout: 1s
      retries: 20
      start_period: 2s

networks:
  range:
    name: dc-night-range
    driver: bridge
    internal: true
